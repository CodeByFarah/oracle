<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORACLE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%231d1d1f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230071e3'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff; --alt: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --sub: #6e6e73; --hair: #d2d2d7;
    --blue: #0071e3; --link: #0066cc; --green: #248a3d; --red: #d70015; --orange: #b25000; --track: #e8e8ed;
    --bar: rgba(255, 255, 255, .8);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); letter-spacing: -.01em;
         font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
         -webkit-font-smoothing: antialiased; }

  /* Frosted global bar */
  .bar { position: sticky; top: 0; z-index: 10; background: var(--bar); backdrop-filter: saturate(180%) blur(20px);
         -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hair); }
  .bar-inner { max-width: 1024px; margin: 0 auto; padding: 0 22px; height: 48px; display: flex; align-items: center; gap: 28px; }
  .brand { font-weight: 600; font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
  nav { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  nav::-webkit-scrollbar { display: none; }
  nav button { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--sub); cursor: pointer;
               white-space: nowrap; transition: color .2s; letter-spacing: 0; }
  nav button:hover, nav button[aria-selected="true"] { color: var(--text); }
  nav button[aria-selected="true"] { font-weight: 600; }
  .safety { font-size: 12px; color: var(--sub); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .dot.off { background: var(--red); }
  @media (max-width: 760px) { .safety { display: none; } .bar-inner { gap: 18px; } }

  section { display: none; } section.active { display: block; animation: fade .5s ease both; }
  .band { padding: 80px 22px; } .band.alt { background: var(--alt); } .band.tight { padding-top: 0; }
  .wrap { max-width: 980px; margin: 0 auto; }

  .eyebrow { font-size: 17px; font-weight: 600; color: var(--orange); margin: 0 0 6px; text-align: center; }
  h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.06; font-weight: 600; letter-spacing: -.025em; margin: 0; text-align: center; }
  .lede { font-size: clamp(19px, 2.2vw, 24px); line-height: 1.35; color: var(--sub); max-width: 720px; margin: 18px auto 0; text-align: center; font-weight: 400; }
  h2 { font-size: clamp(30px, 4vw, 44px); line-height: 1.1; font-weight: 600; letter-spacing: -.02em; margin: 0 0 10px; }
  h2 + .lede, h2 + p.sub { margin-top: 0; }
  .center { text-align: center; }
  p.sub { color: var(--sub); margin: 0 0 32px; font-size: 19px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; margin-top: 56px; }
  .tile { background: var(--card); border-radius: 18px; padding: 28px 26px 26px; }
  .band:not(.alt) .tile { background: var(--alt); }
  .tile .k { font-size: 14px; color: var(--sub); font-weight: 500; }
  .tile .v { font-size: 44px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 14px; color: var(--sub); }
  .meter { height: 4px; border-radius: 2px; background: var(--track); margin-top: 18px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--text); transition: width 1.2s cubic-bezier(.25,.1,.25,1); }

  .card { background: var(--card); border-radius: 18px; padding: 28px 30px; overflow-x: auto; }
  .band:not(.alt) .card { background: var(--alt); }
  .card + .card { margin-top: 20px; }
  .card h3 { font-size: 24px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; margin: 0 0 6px; }
  .card h4 { font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 10px; }
  .card p { margin: 0 0 8px; }
  .fine { font-size: 12px; color: var(--sub); line-height: 1.5; }
  .note { font-size: 14px; color: var(--sub); text-align: center; margin: 40px auto 0; max-width: 680px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--sub); padding: 0 16px 10px 0; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  td { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .strength { display: inline-block; width: 80px; height: 4px; border-radius: 2px; background: var(--track); vertical-align: middle; margin-right: 10px; overflow: hidden; }
  .strength i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }

  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 980px; background: var(--track); color: var(--sub); }
  .badge.good { color: var(--green); } .badge.bad { color: var(--red); }
  .good { color: var(--green); } .bad { color: var(--red); } .muted { color: var(--sub); }
  ul.plain { margin: 0; padding-left: 20px; color: var(--sub); } ul.plain li { margin: 4px 0; }

  .empty { text-align: center; padding: 72px 22px 88px; }
  .empty h2 { margin-bottom: 12px; }
  .empty p { color: var(--sub); font-size: 19px; max-width: 600px; margin: 0 auto; }
  .empty code { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--alt); padding: 2px 8px; border-radius: 6px; }

  details { margin-top: 20px; } summary { cursor: pointer; color: var(--link); font-size: 17px; list-style: none; }
  summary::-webkit-details-marker { display: none; } summary::after { content: " ›"; }
  details[open] summary::after { content: " ⌄"; }
  pre { white-space: pre-wrap; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--sub); margin: 16px 0 0; }

  input[type=search] { width: 100%; max-width: 480px; display: block; margin: 0 auto 36px; font: inherit; font-size: 17px; color: var(--text);
    background: var(--alt); border: 1px solid transparent; border-radius: 12px; padding: 12px 16px; outline: none; transition: border-color .2s; }
  .band.alt input[type=search] { background: var(--card); }
  input[type=search]:focus { border-color: var(--blue); }
  .entry { padding: 22px 0; border-bottom: 1px solid var(--hair); } .entry:last-child { border-bottom: 0; }
  .entry h3 { font-size: 19px; font-weight: 600; margin: 0 0 6px; } .entry p { color: var(--sub); margin: 0 0 4px; }

  footer { background: var(--alt); border-top: 1px solid var(--hair); }
  footer .wrap { padding: 20px 22px 28px; font-size: 12px; color: var(--sub); line-height: 1.6; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 640px) { .band { padding: 56px 18px; } .card { padding: 22px 20px; } }
</style>
</head>
<body>
<div class="bar">
  <div class="bar-inner">
    <span class="brand">ORACLE</span>
    <nav role="tablist" id="tabs" aria-label="Sections"></nav>
    <span class="safety" id="safety"></span>
  </div>
</div>
<main>
  <section id="market"></section>
  <section id="discoveries"></section>
  <section id="lab"></section>
  <section id="strategies"></section>
  <section id="portfolio"></section>
  <section id="risk"></section>
  <section id="data"></section>
  <section id="experiments"></section>
</main>
<footer><div class="wrap" id="foot">ORACLE is research software. Every figure is computed from stored data and is an estimate, not a forecast.
  Historical patterns do not promise future returns. No real money is traded and no real broker is connected.</div></footer>
<script>
"use strict";
// Every value is rendered as a text node, never parsed as markup: artifact contents are data.
const VIEWS = [["market","Overview"],["discoveries","Discoveries"],["lab","Research"],["strategies","Strategies"],
               ["portfolio","Portfolio"],["risk","Risk"],["data","Data"],["experiments","Experiments"]];

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of kids) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}
const fmt = (x, d = 2) => (x === null || x === undefined || Number.isNaN(Number(x))) ? "–" : Number(x).toFixed(d);
const sci = (x) => (x === null || x === undefined) ? "–" : Number(x).toExponential(2);
const pct = (x) => (x === null || x === undefined) ? "–" : Math.round(100 * x) + "%";
const short = (s, n = 23) => (s ? String(s).slice(0, n) : "–");
const words = (s) => String(s || "").replace(/_/g, " ");
const title = (s) => words(s).replace(/^./, c => c.toUpperCase());

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function fill(id, ...nodes) { document.getElementById(id).replaceChildren(...nodes.filter(Boolean)); }
const band = (cls, ...kids) => el("div", { class: "band " + cls }, el("div", { class: "wrap" }, ...kids));
const card = (...kids) => el("div", { class: "card" }, ...kids);
function table(headers, rows, numeric = []) {
  return el("table", {}, el("thead", {}, el("tr", {}, ...headers.map((h, i) => el("th", numeric.includes(i) ? { style: "text-align:right" } : {}, h)))),
    el("tbody", {}, ...rows.map(r => el("tr", {}, ...r.map((v, i) => el("td", numeric.includes(i) ? { class: "num" } : {}, v))))));
}
function header(eyebrow, heading, lede) {
  return [eyebrow ? el("p", { class: "eyebrow" }, eyebrow) : null, el("h1", {}, heading), lede ? el("p", { class: "lede" }, lede) : null];
}
function empty(heading, text, cmd) {
  return el("div", { class: "empty" }, el("h2", {}, heading), el("p", {}, text, cmd ? " " : null, cmd ? el("code", {}, cmd) : null));
}
function tile(k, v, s, frac) {
  const meter = el("div", { class: "meter" }, el("i"));
  if (frac !== null && frac !== undefined) requestAnimationFrame(() => setTimeout(() => {
    meter.firstChild.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + "%"; }, 60));
  return el("div", { class: "tile" }, el("div", { class: "k" }, k), el("div", { class: "v" }, v), el("div", { class: "s" }, s),
    frac === null || frac === undefined ? null : meter);
}
async function guarded(id, fn) {
  try { await fn(); } catch (e) {
    fill(id, band("", empty("Nothing to show yet.", String(e.message) + ". Load data and run a research cycle:",
      "oracle loop run-once")));
  }
}

/* Overview */
async function market() {
  const w = await api("/api/world");
  const s = w.snapshot, regime = s.market_regime;
  const edges = [...(s.cross_asset_signals || [])].sort((a, b) => Math.abs(b.strength) - Math.abs(a.strength));
  const anomalies = s.anomalies || [];
  const vars = Object.entries((s.state && s.state.variables) || {}).map(([k, v]) => [words(k), fmt(v, 5), words(((s.state.epistemic_status || {})[k]) || "–")]);
  fill("market",
    band("", ...header("Market reading · " + new Date(s.as_of).toLocaleString(),
      regime ? title(regime.label) + "." : "Regime not yet estimated.",
      `Volatility is ${words(s.volatility_state)}. Liquidity is ${words(s.liquidity_state)}. ` +
      (regime ? `The model expects this regime to last about ${fmt(regime.expected_duration_bars, 0)} more bars.` : "")),
      el("div", { class: "tiles" },
        tile("Regime probability", regime ? pct(regime.probability) : "–", regime ? `Regime ${regime.regime_id + 1} of ${regime.n_regimes}` : "Not fitted", regime ? regime.probability : null),
        tile("Volatility", pct(s.volatility_percentile), "Percentile of its own history", s.volatility_percentile),
        tile("Liquidity", pct(s.liquidity_percentile), "Percentile of its own history", s.liquidity_percentile),
        tile("Confidence", pct(s.confidence), "How much to trust this reading", s.confidence)),
      el("p", { class: "note" }, "These are estimates from past data. They describe the current state of the market; they are not price forecasts.")),
    band("alt",
      el("h2", { class: "center" }, "How assets move together."),
      el("p", { class: "sub center" }, edges.length + " links passed the multiple-testing threshold. Association is not causation."),
      edges.length ? card(table(["Pair", "Kind", "Strength", "p-value", "Stability"], edges.map(e => [
        e.source + (e.direction === "undirected" ? " ↔ " : " → ") + e.target, words(e.kind),
        el("span", {}, el("span", { class: "strength" }, el("i", { style: `width:${Math.min(100, Math.abs(e.strength) * 100).toFixed(0)}%` })), fmt(e.strength)),
        sci(e.p_value), pct(e.stability)]), [3, 4]))
        : card(el("p", { class: "muted center" }, "No link between assets was strong enough to report."))),
    band("",
      el("h2", { class: "center" }, anomalies.length ? `${anomalies.length} anomalies flagged.` : "No anomalies."),
      el("p", { class: "sub center" }, "Unusual readings measured against each variable's own history."),
      anomalies.length ? card(table(["Variable", "When", "Robust z", "Rarity"], anomalies.map(a =>
        [words(a.variable), new Date(a.timestamp).toLocaleString(), fmt(a.robust_z), pct(a.rarity)]), [2, 3])) : null,
      card(el("h3", {}, "All readings"), el("p", { class: "fine" }, "Each variable with its epistemic status: observed directly, or estimated by a model."),
        table(["Variable", "Value", "Status"], vars, [1]),
        el("details", {}, el("summary", {}, "Read the full summary"), el("pre", {}, w.text)))));
}

/* Discoveries */
const STATUS = { candidate: "Candidate", validated_oos: "Validated out of sample", failed_oos: "Failed out of sample",
  survived_adversarial: "Passed adversarial checks", rejected_adversarial: "Rejected by adversarial checks",
  paper_trading: "Paper trading", retired: "Retired" };
function badgeClass(status) { return /reject|fail|retired/.test(status) ? "bad" : /surviv|validat|paper/.test(status) ? "good" : ""; }
function hypothesis(h) {
  const adv = h.adversarial, pred = h.prediction || {};
  const score = adv && adv.score ? fmt(adv.score.score) : "Not scored";
  return card(
    el("p", { class: "fine" }, h.hypothesis_id + " · Discovery score " + score),
    el("h3", {}, h.statement),
    el("span", { class: "badge " + badgeClass(String(h.status)) }, STATUS[h.status] || title(h.status)),
    el("h4", {}, "Prediction"),
    el("p", {}, `${pred.direction === "negative" ? "A decline" : "A rise"} of about ${fmt(Math.abs(Number(pred.expected_effect_bps)))} basis points over ${pred.horizon_bars ?? "–"} bars, under the conditions it was found in.`),
    el("h4", {}, "Evidence"),
    table(["Split", "Events", "Effect (bps)", "t", "p", "Adjusted p", "After costs"], (h.observations || []).map(o => [o.split, o.n_events,
      fmt(o.effect_bps), fmt(o.t_stat), sci(o.p_value), o.p_adjusted == null ? "–" : fmt(o.p_adjusted, 4), fmt(o.cost_adjusted_effect_bps)]), [1, 2, 3, 4, 5, 6]),
    el("h4", {}, "Possible mechanisms (untested)"),
    el("ul", { class: "plain" }, ...(h.mechanisms || []).map(m => el("li", {}, title(m.name) + ": " + m.explanation))),
    el("h4", {}, "Adversarial checks"),
    adv ? table(["Check", "Result", "Detail"], (adv.checks || []).map(c => [title(c.name),
      el("span", { class: c.status === "passed" ? "good" : c.status === "failed" ? "bad" : "muted" }, title(c.status)), c.detail || ""]))
      : el("p", { class: "muted" }, "Not yet tested."),
    el("h4", {}, "Invalidated if"),
    el("ul", { class: "plain" }, ...(h.invalidation || []).map(i => el("li", {}, i.rule))),
    el("p", { class: "fine", style: "margin-top:20px" }, `Protocol ${h.protocol_hash} · Data ${short(h.dataset_version)} · Features ${short(h.feature_set_id)}`));
}
async function discoveries() {
  const items = await api("/api/hypotheses");
  if (!items.length) {
    fill("discoveries", band("", ...header("Discoveries", "No discoveries yet.",
      "No pattern has survived the first statistical test. On synthetic data, that is the correct answer: there is nothing real to find.")));
    return;
  }
  const standing = items.filter(h => badgeClass(String(h.status)) !== "bad").length;
  fill("discoveries",
    band("", ...header("Discoveries", `${standing} of ${items.length} still standing.`,
      "Every hypothesis is listed, including the ones that failed. Each one shows its evidence and the tests it faced.")),
    band("alt", ...items.map(hypothesis)));
}

/* Research */
async function lab() {
  const [loops, journal] = await Promise.all([api("/api/loops"), api("/api/journal")]);
  const tests = loops.reduce((t, l) => t + l.tests_run, 0), validated = loops.reduce((t, l) => t + l.validated_hypotheses, 0);
  const search = el("input", { type: "search", name: "q", placeholder: "Search the research journal", "aria-label": "Search the research journal" });
  const list = card();
  const render = (entries) => list.replaceChildren(...(entries.length ? entries.map(e => el("div", { class: "entry" },
    el("h3", {}, e.question || "–"), el("p", {}, e.result || ""), el("p", {}, e.interpretation || ""),
    el("p", { class: "fine" }, "Method: " + (e.method || "–")), el("p", { class: "fine" }, "Next: " + (e.next_experiment || "–"))))
    : [el("p", { class: "muted center" }, "No entries found.")]));
  render(journal);
  let timer = null;
  search.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(async () => {
    try { render(await api("/api/journal?q=" + encodeURIComponent(search.value))); } catch (_) { /* keep last view */ } }, 220); });
  fill("lab",
    band("", ...header("Research", `${tests.toLocaleString()} tests. ${validated} validated.`,
      "Every experiment is planned and registered before it runs, and every result is recorded, including failures."),
      el("div", { class: "tiles" }, tile("Cycles", loops.length, "Research cycles run"), tile("Tests", tests.toLocaleString(), "Statistical tests"),
        tile("Validated", validated, "Passed out-of-sample"))),
    band("alt", el("h2", { class: "center" }, "Cycles."),
      loops.length ? card(table(["Cycle", "Experiments", "Tests", "Validated", "Survived checks", "Notes"],
        loops.map(l => [l.name, l.experiments, l.tests_run, l.validated_hypotheses, l.adversarial_survivors, (l.notes || []).join(" · ")]), [1, 2, 3, 4]))
        : card(el("p", { class: "muted center" }, "No cycles yet."))),
    band("", el("h2", { class: "center" }, "Journal."), el("p", { class: "sub center" }, "What was asked, what was found, and what comes next."), search, list));
}

/* Strategies, portfolio, risk, data, experiments */
async function strategies() {
  const items = await api("/api/strategies");
  fill("strategies", items.length
    ? band("", ...header("Strategies", "Paper trading only.", "Strategies are promoted no further than paper trading."),
        el("div", { style: "margin-top:48px" }, card(table(["Strategy", "Hypothesis", "Stage", "Lifecycle", "Fills", "Rejected", "Realized (bps)", "Reasons"],
          items.map(s => [s.strategy_id, s.hypothesis_id, title(s.stage), title((s.lifecycle || {}).state), s.paper_fills, s.paper_rejections,
            s.feedback && s.feedback.overall ? fmt(s.feedback.overall.mean_realized_bps) : "–", ((s.lifecycle || {}).reasons || []).join("; ")]), [4, 5, 6]))))
    : band("", ...header("Strategies", "No strategies yet.", "A strategy is created only after a hypothesis passes every adversarial check.")));
}
async function portfolio() {
  const items = await api("/api/strategies");
  const rows = items.flatMap(s => ((s.feedback || {}).diagnosis || []).map(d => [s.strategy_id, d]));
  fill("portfolio", rows.length
    ? band("", ...header("Portfolio", "Simulated positions.", "Paper money only."), el("div", { style: "margin-top:48px" }, card(table(["Strategy", "Diagnosis"], rows))))
    : band("", ...header("Portfolio", "No positions.", "No paper trades have been placed. No real money is ever traded.")));
}
async function risk() {
  const [r, h] = await Promise.all([api("/api/risk"), api("/api/health")]);
  const limits = Object.entries(r.limits).filter(([, v]) => typeof v !== "object" || v === null)
    .map(([k, v]) => [title(k), typeof v === "number" ? fmt(v, 3) : String(v)]);
  fill("risk",
    band("", ...header("Risk", r.live_trading_enabled ? "Live trading is enabled." : "Live trading is off.",
      "Every order passes validation, the kill switch and the risk engine before it reaches a broker. No real broker is connected."),
      el("div", { class: "tiles" },
        tile("Live trading", r.live_trading_enabled ? "On" : "Off", "Disabled by default"),
        tile("Kill switch", r.kill_switch_engaged ? "Engaged" : "Off", "Stops all order flow"),
        tile("Real broker", "None", "Orders cannot reach a market"),
        tile("Environment", title(h.environment), "Current configuration"))),
    band("alt", el("h2", { class: "center" }, "Limits."), el("p", { class: "sub center" }, "Any order that breaks one of these is rejected."),
      card(table(["Limit", "Value"], limits, [1]))));
}
async function data() {
  const [items, h] = await Promise.all([api("/api/data?quality=true"), api("/api/health")]);
  const rows = items.map(d => {
    if (!d.present) return [title(d.dataset), "–", "–", "–", el("span", { class: "muted" }, "Not loaded"), "–"];
    const errors = d.quality ? (d.quality.issues || []).filter(i => i.severity === "error").length : 0;
    return [title(d.dataset), short(d.version), Number(d.rows).toLocaleString(), d.partitions,
      d.integrity_problems.length ? el("span", { class: "bad" }, d.integrity_problems.length + " problems") : el("span", { class: "good" }, "Verified"),
      d.quality ? el("span", { class: errors ? "bad" : "good" }, errors ? errors + " errors" : "Passed") : "–"];
  });
  const unchecked = items.filter(d => d.quality && d.quality.unchecked)
    .flatMap(d => Object.entries(d.quality.unchecked).map(([k, v]) => [title(d.dataset), title(k), String(v)]));
  const real = h.providers.some(p => p.enabled && !p.synthetic);
  fill("data",
    band("", ...header("Data", real ? "Real market data connected." : "Synthetic data only.",
      "Every dataset is fingerprinted, versioned and checked for quality before research can use it."),
      el("div", { style: "margin-top:48px" }, card(table(["Dataset", "Version", "Rows", "Files", "Integrity", "Quality"], rows, [2, 3])))),
    band("alt", el("h2", { class: "center" }, "Sources."), el("p", { class: "sub center" }, "Free sources only. Paid sources are optional and switched off."),
      card(table(["Provider", "Status", "Cost", "Type", "Note"], h.providers.map(p => [p.name,
        p.enabled ? el("span", { class: "good" }, "On") : el("span", { class: "muted" }, "Off"),
        p.requires_payment ? "Paid, optional" : "Free", p.synthetic ? "Synthetic" : "Real data", p.reason || ""])))),
    unchecked.length ? band("", el("h2", { class: "center" }, "Not yet checked."),
      el("p", { class: "sub center" }, "Checks that need a data source ORACLE does not have yet."),
      card(table(["Dataset", "Check", "Reason"], unchecked))) : null);
}
async function experiments() {
  const items = await api("/api/experiments");
  fill("experiments", items.length
    ? band("", ...header("Experiments", "Registered before they run.", "Each experiment's plan is fixed and fingerprinted in advance, so results cannot be tuned after the fact."),
        el("div", { style: "margin-top:48px" }, card(table(["Protocol", "Name", "Horizons", "Tests", "Passed FDR", "Validated", "Dataset"],
          items.map(e => [e.protocol_hash, e.name, (e.horizons || []).join(", "), e.n_tests, e.discovery_survivors, e.validated, short(e.dataset_version, 19)]), [3, 4, 5]))))
    : band("", ...header("Experiments", "No experiments yet.", "Run a research cycle to register the first one.")));
}

/* Boot */
const LOADERS = { market, discoveries, lab, strategies, portfolio, risk, data, experiments };
function show(id) {
  for (const [v] of VIEWS) {
    document.getElementById(v).classList.toggle("active", v === id);
    document.getElementById("tab-" + v).setAttribute("aria-selected", String(v === id));
  }
  window.scrollTo({ top: 0 });
  guarded(id, LOADERS[id]);
  try { localStorage.setItem("oracle-tab", id); } catch (_) { /* storage unavailable */ }
}
const nav = document.getElementById("tabs");
for (const [id, label] of VIEWS) {
  const b = el("button", { id: "tab-" + id, role: "tab", "aria-selected": "false" }, label);
  b.addEventListener("click", () => show(id));
  nav.append(b);
}
api("/api/health").then(h => {
  document.getElementById("safety").replaceChildren(el("span", { class: "dot" + (h.live_trading_enabled ? " off" : "") }),
    h.live_trading_enabled ? "Live trading on" : "Paper only");
  document.getElementById("foot").append(el("br"), `Version ${h.version} · ${title(h.environment)} environment`);
}).catch(() => document.getElementById("safety").replaceChildren("Offline"));
let start = "market";
try { start = localStorage.getItem("oracle-tab") || "market"; } catch (_) { /* ignore */ }
show(Object.prototype.hasOwnProperty.call(LOADERS, start) ? start : "market");
</script>
