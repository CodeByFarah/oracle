<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ORACLE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23eb001b'/%3E%3Cstop offset='1' stop-color='%23f79e1b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%2314161b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="sr skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="rail" id="rail" aria-label="Main navigation">
    <a class="brand" href="#/home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="brand-warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eb001b"/><stop offset=".55" stop-color="#ff5f00"/><stop offset="1" stop-color="#f79e1b"/></linearGradient></defs>
        <circle cx="16" cy="16" r="12" fill="none" stroke="url(#brand-warm)" stroke-width="4"/><circle cx="16" cy="16" r="4.5" fill="currentColor"/>
      </svg>
      <span><span class="brand-name">ORACLE</span><span class="brand-tag">Money, with intelligence</span></span>
    </a>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <p class="sandbox-note"><b>Sandbox.</b> Synthetic customer and data. Cards and payments run on sandbox providers; no real money moves.</p>
    </div>
  </aside>
  <div class="main-col">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="search-btn" id="open-palette" type="button" aria-label="Search and commands">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4-4"/></svg>
        <span>Search, jump or ask</span><kbd>Ctrl K</kbd>
      </button>
      <div class="top-tools">
        <button class="engine-pill" id="engine" type="button" aria-label="Open the assistant (Ctrl J)"><span class="dot"></span><span class="label">AI</span></button>
        <div style="position:relative">
          <button class="icon-btn" id="bell" type="button" aria-label="Alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zm4 4h4"/></svg><span class="badge-dot" hidden></span></button>
          <div class="popover" id="alerts-pop" hidden></div>
        </div>
        <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg></button>
        <span class="avatar" id="avatar" aria-hidden="true">·</span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<aside class="assistant-dock" id="assistant-dock" aria-label="Oracle assistant" hidden></aside>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search and commands">
  <div class="palette-box">
    <input id="palette-input" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list"
           placeholder="Jump to a page, card or account, or ask Oracle">
    <ul id="palette-list" role="listbox"></ul>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span>
      <span><kbd>Ctrl J</kbd> assistant</span><span><kbd>/</kbd> search</span><span><kbd>R</kbd> refresh</span></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script src="/static/core.js"></script>
<script src="/static/money.js"></script>
<script src="/static/assistant.js"></script>
<script src="/static/research.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
