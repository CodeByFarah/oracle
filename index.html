<!doctype html>
<html lang="en">
<head>﻿<script>
(function () {
  var realFetch = window.fetch.bind(window), cache = {};
  function k(p) { return "demo-data/" + p.replace(/^\//, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "") + ".json"; }
  function load(f) { if (!cache[f]) cache[f] = realFetch(f).then(function (r) { if (!r.ok) throw r.status; return r.json(); }); return cache[f]; }
  function json(v, s) { return new Response(JSON.stringify(v), { status: s || 200, headers: { "Content-Type": "application/json" } }); }
  function ndjson(lines) { return new Response(lines, { status: 200, headers: { "Content-Type": "application/x-ndjson" } }); }
  function has(v, w) { return v && String(v).toLowerCase().indexOf(w) !== -1; }
  function get(u) {
    var url = new URL(u, "http://x"), p = url.pathname, q = url.searchParams;
    if (p === "/api/bars") {
      var lim = parseInt(q.get("limit") || "0", 10);
      return load("demo-data/api_bars_" + (q.get("symbol") || "").replace(/[^A-Za-z0-9]/g, "_") + "_" + (q.get("interval") || "").replace(/[^A-Za-z0-9]/g, "_") + ".json")
        .then(function (d) { if (lim && d && Array.isArray(d.bars)) d = Object.assign({}, d, { bars: d.bars.slice(-lim) }); return json(d); });
    }
    if (p === "/api/journal" && q.get("q")) {
      var s = q.get("q").toLowerCase();
      return load(k("/api/journal?limit=500")).then(function (d) { var it = Array.isArray(d) ? d : (d.items || d.entries || []); var hit = it.filter(function (x) { return JSON.stringify(x).toLowerCase().indexOf(s) !== -1; }); return json(Array.isArray(d) ? hit : Object.assign({}, d, d.items ? { items: hit } : { entries: hit })); });
    }
    if (p === "/api/fintech/transactions") {
      return load("demo-data/fin_transactions_all.json").then(function (d) {
        var it = d.items;
        (q.get("q") || "").toLowerCase().split(/\s+/).filter(Boolean).forEach(function (w) { it = it.filter(function (t) { return has(t.merchant_name, w) || has(t.description, w) || has(t.city, w) || has(t.note, w); }); });
        ["category", "account_id", "card_id", "status", "kind"].forEach(function (f) { if (q.get(f)) it = it.filter(function (t) { return t[f] === q.get(f); }); });
        if (q.get("flagged") === "true") it = it.filter(function (t) { return t._flagged; });
        if (q.get("since")) it = it.filter(function (t) { return t.occurred_at >= q.get("since"); });
        if (q.get("until")) it = it.filter(function (t) { return t.occurred_at < q.get("until"); });
        var off = parseInt(q.get("offset") || "0", 10), lim = parseInt(q.get("limit") || "50", 10);
        return json({ total: it.length, items: it.slice(off, off + lim) });
      });
    }
    return load(k(u)).then(json, function () { return load(k(p)).then(json, function () { return json({ detail: "Not available in the demo." }, 404); }); });
  }
  function chat(body) {
    var msg = ""; try { msg = JSON.parse(body).message || ""; } catch (e) {}
    return load("demo-data/chat_answers.json").then(function (a) {
      if (a[msg]) return ndjson(a[msg]);
      var text = "This is a static demo, so I can only answer the suggested questions here. Run ORACLE locally to ask anything; it uses a local open-source model through Ollama, or the instant offline engine.";
      return ndjson([JSON.stringify({ type: "meta", conversation_id: null }), JSON.stringify({ type: "token", text: text }), JSON.stringify({ type: "done", engine: "offline", conversation_id: null })].join("\n") + "\n");
    });
  }
  window.fetch = function (input, init) {
    var u = typeof input === "string" ? input : input.url;
    if (u.indexOf("/api/") !== 0) return realFetch(input, init);
    var method = ((init && init.method) || "GET").toUpperCase();
    if (method === "GET") return get(u);
    if (method === "POST" && u.indexOf("/api/ai/chat") === 0) return chat(init && init.body);
    return Promise.resolve(json({ detail: "Read-only demo: changes are disabled here. Clone the repository to run ORACLE with its sandbox bank." }, 403));
  };
})();
</script>

<div class="app">
  <aside class="rail" id="rail" aria-label="Main navigation">
    <a class="brand" href="#/home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="brand-warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eb001b"/><stop offset=".55" stop-color="#ff5f00"/><stop offset="1" stop-color="#f79e1b"/></linearGradient></defs>

  <div class="main-col">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="search-btn" id="open-palette" type="button" aria-label="Search and commands">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4-4"/></svg>
        <span>Search, jump or ask</span><kbd>Ctrl K</kbd>
      </button>
      <div class="top-tools">
        <button class="engine-pill" id="engine" type="button" aria-label="Open the assistant (Ctrl J)"><span class="dot"></span><span class="label">AI</span></button>
        <div style="position:relative">
          <button class="icon-btn" id="bell" type="button" aria-label="Alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zm4 4h4"/></svg><span class="badge-dot" hidden></span></button>
          <div class="popover" id="alerts-pop" hidden></div>
        </div>
        <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg></button>
        <span class="avatar" id="avatar" aria-hidden="true">·</span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

      <span><kbd>Ctrl J</kbd> assistant</span><span><kbd>/</kbd> search</span><span><kbd>R</kbd> refresh</span></div>
