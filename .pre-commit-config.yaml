repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-contracts
        name: import-linter layer contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: no-env-files
        name: block committing .env files
        entry: .env files must never be committed
        language: fail
        files: (^|/)\.env($|\.(?!example$))
